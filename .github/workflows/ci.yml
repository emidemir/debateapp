name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check Django
        run: |
          docker build -t "debateapp-backend:$GITHUB_SHA" ./backend
          docker run --rm --entrypoint python \
            "debateapp-backend:$GITHUB_SHA" manage.py check

      - name: Build React and check Nginx
        run: |
          docker build -t "debateapp-frontend:$GITHUB_SHA" ./frontend
          docker run --rm --entrypoint nginx \
            "debateapp-frontend:$GITHUB_SHA" -t
      
      - name: Publish dev images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          for component in backend frontend; do
            local_image="debateapp-$component:$GITHUB_SHA"
            registry_image="ghcr.io/emidemir/debateapp-$component:$GITHUB_SHA"
            docker tag "$local_image" "$registry_image"
            docker push "$registry_image"
          done
  deploy-dev:
    name: Deploy dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: development
      url: https://debateapp-dev.emirhanutkudemir.com/
    permissions:
      packages: read
    concurrency:
      group: debateapp-dev
      cancel-in-progress: false

    steps:
      - name: Deploy the commit and check HTTPS
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(git ls-remote --exit-code \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" | cut -f1)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on develop. Skipping this deployment."
            exit 0
          fi

          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "${VPS_SSH_KEY:?Set VPS_SSH_KEY}" > "$ssh_dir/key"
          printf '%s\n' "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}" > "$ssh_dir/known_hosts"

          printf '%s\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -T -i "$ssh_dir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
              "debateapp-deploy@${VPS_HOST:?Set VPS_HOST}"

          status=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            --max-time 10 -o /dev/null -w '%{http_code}' \
            https://debateapp-dev.emirhanutkudemir.com/)
          test "$status" = 200
          echo "Deployed $GITHUB_SHA and verified HTTPS."